name: scanservjs
version: "0.2.0"
slug: scanservjs
description: Scanner USB via SANE et interface web
arch: [aarch64, amd64]
init: false
usb: true
privileged: [SYS_RAWIO]
startup: application
ingress: true
ingress_port: 8080
panel_icon: mdi:scanner
panel_title: Scanner
panel_admin: false
options:
  scan_dir: "/share/scanner"
schema:
  scan_dir: str
map:
  - share:rw
  - media:rw